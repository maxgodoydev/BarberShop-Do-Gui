name: Verificação do projeto
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci-only, POSTGRES_DB: barbershop_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python scripts/check_project.py
      - name: Sintaxe JavaScript
        run: for f in app/src/main/resources/static/js/*.js; do node --check "$f"; done
      - name: Banco (schema, views, seed e migrações 004-010 em PostgreSQL real)
        env: {PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci-only, PGDATABASE: barbershop_ci}
        run: |
          bash database/aplicar.sh --demo
          bash database/aplicar.sh --demo   # reaplicar: as migrações precisam ser idempotentes
      - name: Testes do banco (falha se um caso não se comportar como esperado)
        env: {PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci-only, PGDATABASE: barbershop_ci}
        run: python scripts/verifica_banco.py
      - name: Pipeline Python e testes
        run: |
          pip install -r analytics/requirements.txt
          cd analytics && python -m unittest discover -s tests -v
      - name: Paridade BI do sistema (fn_bi_resumo) x pipeline Python
        env: {PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci-only, PGDATABASE: barbershop_ci}
        run: python scripts/paridade_bi.py
      - name: Ajuste de catálogo opt-in (idempotente e sem quebrar a reaplicação das migrações)
        env: {PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci-only, PGDATABASE: barbershop_ci}
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -f database/ajustes/catalogo_gui.sql
          psql -X -q -v ON_ERROR_STOP=1 -f database/ajustes/catalogo_gui.sql   # 2ª vez: sem efeito
          bash database/aplicar.sh --demo                                         # reaplicar não pode desfazer nem estourar
          test "$(psql -X -tA -c "SELECT count(*) FROM servicos WHERE (id=1 AND nome='Corte' AND preco=35 AND duracao_minutos=40 AND ativo) OR (id IN (2,4) AND NOT ativo) OR (id=5 AND preco=20) OR (id=6 AND preco=50)")" = "5"
      - name: Compilar e testar Java
        run: mvn --batch-mode verify
        working-directory: app
