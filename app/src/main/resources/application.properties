spring.application.name=barbershop-do-gui
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=${FORWARD_HEADERS:none}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Banco (PostgreSQL). Credenciais SOMENTE por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbershop_gui}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Sao_Paulo'
spring.sql.init.mode=never

# Regras de agendamento
app.timezone=America/Sao_Paulo
app.booking.hold-minutes=10
app.booking.confirm-minutes=30
app.booking.horizon-days=60
app.booking.min-lead-minutes=60
app.booking.slot-step-minutes=15
app.booking.cancel-min-hours=24
app.booking.expire-sweep-ms=60000
app.access-link.ttl-minutes=15
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# E-mail: dev (NÃO envia; imprime no log local) ou smtp
app.mail.mode=${MAIL_MODE:dev}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Conta inicial do proprietário (somente se a tabela de usuários estiver vazia)
app.bootstrap.owner-username=${BOOTSTRAP_OWNER_USERNAME:}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD:}
app.bootstrap.owner-name=${BOOTSTRAP_OWNER_NAME:Propriet\u00e1rio}

# Dados públicos da barbearia: deixe vazio até confirmar com o proprietário (nada é inventado)
app.shop.name=BarberShop do Gui
app.shop.address=${SHOP_ADDRESS:Av. Pres. Jo\u00e3o Goulart, 940 - Jardim Malia II, S\u00e3o Paulo - SP, 04821-000}
app.shop.phone=${SHOP_PHONE:}
app.shop.whatsapp-url=${SHOP_WHATSAPP_URL:}
app.shop.maps-url=${SHOP_MAPS_URL:https://maps.app.goo.gl/LhZ4Yg1AMcXsRRKK7}
app.shop.hours-text=${SHOP_HOURS_TEXT:Seg 11h-20h30 | Ter a S\u00e1b 10h-20h30 | Dom fechado}
app.shop.instagram-url=${SHOP_INSTAGRAM_URL:https://www.instagram.com/barbershop_dogui/}
app.shop.facebook-url=${SHOP_FACEBOOK_URL:https://www.facebook.com/p/BarberShop-Do-Gui-100050410702068/?locale=pt_BR}
