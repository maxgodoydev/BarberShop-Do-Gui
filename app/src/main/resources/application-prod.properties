# Perfil "prod": ative com SPRING_PROFILES_ACTIVE=prod no deploy (Render, Railway etc.).
# Define padrões seguros que NÃO dependem de lembrar variáveis de ambiente.
# Cookie de sessão só trafega por HTTPS.
server.servlet.session.cookie.secure=true
# Atrás de proxy/balanceador: usa X-Forwarded-For para o IP real do cliente. Sem isto, o limite de tentativas
# (login e links) enxergaria o IP do proxy e viraria um limite global compartilhado por todos.
server.forward-headers-strategy=framework
